<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在学生ポータル ログイン - 店魅偉屋大学</title>
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', 'Noto Serif JP', sans-serif;
            background-color: #f4f7f6;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #333;
        }
        .login-container {
            background-color: white; padding: 40px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center; width: 100%; max-width: 400px;
        }
        .logo-area img { max-height: 60px; margin-bottom: 15px; }
        .logo-area h1 { font-size: 1.1rem; margin: 0; color: #666; font-weight: normal; }
        .login-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 30px; color: #0056b3; }
        
        .ms-signin-btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            background-color: #2f2f2f; color: white; border: none;
            padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s; border-radius: 6px;
        }
        .ms-signin-btn:hover { background-color: #4a4a4a; }
        .ms-icon { margin-right: 12px; width: 21px; height: 21px; }

        /* --- FeliCa / IDカード --- */
        .divider { margin: 22px 0 16px; font-size: 0.9rem; font-weight: 600; color: #666; letter-spacing: 0.1em; }
        .id-card-area { cursor: pointer; display: inline-block; transition: transform 0.2s ease, opacity 0.2s; }
        .id-card-area:hover { transform: scale(1.02); opacity: 0.9; }
        .id-card-area img { width: 180px; height: auto; border-radius: 8px; display: block; margin: 0 auto; }
        .id-card-text { margin-top: 10px; font-size: 0.9rem; font-weight: 600; color: #0056b3; }
        .error-msg { margin-top: 12px; font-size: 0.85rem; display: none; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <img src="../校章.png" alt="校章" onerror="this.style.display='none'">
            <h1>店魅偉屋大学</h1>
        </div>
        <h2 class="login-title">在学生ポータル</h2>

        <button id="loginButton" class="ms-signin-btn" onclick="signIn()">
            <svg class="ms-icon" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
            Microsoftアカウントでサインイン
        </button>

        <div class="divider">または</div>

        <!-- FeliCa / IDカード(リーダーに置くだけでログイン) -->
        <div class="id-card-area" onclick="signInWithFeliCa()" title="カードをリーダーに置くだけでログインできます">
            <img src="https://u.misemi-ya.net/login/id.jpg" alt="IDカードリーダー">
            <div class="id-card-text">IDカードをかざしてください</div>
        </div>

        <p class="error-msg" id="errorMessage"></p>

        <p style="margin-top:20px; font-size:0.85rem; color:#666;">
            大学発行のアカウント(@misemi-ya.net)または、登録済みのIDカード(FeliCa)を使用してください。<br>
            ※ポータルへのアクセスには学内ネットワーク(VPN)が必要です。
        </p>
        <a href="../index.html" style="display:block; margin-top:30px; font-size:0.9rem; color:#0056b3; text-decoration:none;">大学トップページへ戻る</a>
    </div>

    <script>
        // ========== 設定 ==========
        const API_URL = "https://cf890473.cloudfree.jp/mmu-auth/api.php";   // 職員ポータルと同じAPI
        const READER_URL = "http://127.0.0.1:8765";                          // PC側の reader.py(変更不要)
        const PORTAL_URL = "a/index.html";                                   // ログイン後の移動先
        // ==========================

        const msalConfig = {
            auth: {
                clientId: "40568e89-c868-42c9-8a06-5874c6c0acc1", 
                authority: "https://login.microsoftonline.com/f26d3362-79fe-4262-817a-531c7cdbf597",
                redirectUri: window.location.href
            }
        };
        const myMSALObj = new msal.PublicClientApplication(msalConfig);

        window.addEventListener('load', async () => {
            try {
                await myMSALObj.handleRedirectPromise();
                const currentAccounts = myMSALObj.getAllAccounts();
                if (currentAccounts.length > 0) {
                    // ログイン済みならポータルへ移動
                    window.location.href = PORTAL_URL;
                    return;
                }
            } catch (error) { console.error(error); }
            startAuto();   // カードを置くだけでログインできるよう、自動で待機を開始
        });

        async function signIn() {
            try {
                const res = await myMSALObj.loginPopup({scopes:["User.Read"]});
                if(res) {
                    window.location.href = PORTAL_URL;
                }
            } catch (error) { alert("ログイン失敗: " + error.message); }
        }

        // --- 表示用ヘルパー ---
        function showBox(el, kind, text) {
            const c = { info: ["#e0f2fe", "#0369a1"], ok: ["#dcfce7", "#15803d"], err: ["#fee2e2", "#b91c1c"] }[kind];
            el.style.display = "block";
            el.style.background = c[0];
            el.style.color = c[1];
            el.textContent = text;
        }

        // --- サーバー(PHP API)呼び出し ---
        async function api(action, body) {
            const r = await fetch(`${API_URL}?a=${action}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body || {})
            });
            const j = await r.json().catch(() => ({ error: "サーバーの応答が不正です" }));
            if (!r.ok) throw new Error(j.error || "エラーが発生しました");
            return j;
        }

        // --- FeliCa 自動ログイン(カードを置くだけ) ---
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        let autoId = 0;
        let hintShown = false;

        function startAuto() { stopAuto(); autoLoginLoop(++autoId); }
        function stopAuto() { autoId++; }

        async function autoLoginLoop(myId) {
            const box = document.getElementById("errorMessage");
            const alive = () => myId === autoId;
            let challenge = null, issuedAt = 0, blocked = false;

            while (alive()) {
                // チャレンジは約2分半ごとに取り直す(カードを検知するまで使い回す)
                try {
                    if (!challenge || Date.now() - issuedAt > 150000) {
                        challenge = (await api("challenge")).challenge;
                        issuedAt = Date.now();
                    }
                } catch (e) {
                    if (!alive()) return;
                    hintShown = true;
                    showBox(box, "err", "サーバーに接続できません: " + e.message);
                    challenge = null;
                    await sleep(5000);
                    continue;
                }

                // リーダーに「3秒だけカードを待って」と頼む
                let res;
                try {
                    res = await fetch(`${READER_URL}/read?challenge=${challenge}&t=3`);
                } catch (e) {
                    if (!alive()) return;
                    hintShown = true;
                    showBox(box, "info", "読み取りツール(reader.py)が起動していません。起動するとカードを置くだけでログインできます。");
                    await sleep(3000);
                    continue;
                }
                if (!alive()) return;

                let j = {};
                try { j = await res.json(); } catch (e) {}
                if (hintShown) { box.style.display = "none"; hintShown = false; }

                if (res.status === 408) { blocked = false; continue; }   // カードなし(外れた)
                if (!res.ok) {
                    hintShown = true;
                    showBox(box, "err", "読み取りツールのエラー: " + (j.error || res.status));
                    await sleep(3000);
                    continue;
                }
                if (blocked) { await sleep(800); continue; }             // 失敗したカードが置かれたまま

                showBox(box, "info", "カードを確認しています…");
                try {
                    const r = await api("login", { idm: j.idm, sig: j.sig, challenge: challenge, page: "在学生" });
                    sessionStorage.setItem("felica_token", r.token);
                    sessionStorage.setItem("felica_email", r.email);
                    window.location.href = PORTAL_URL;
                    return;
                } catch (e) {
                    showBox(box, "err", "FeliCa認証エラー: " + e.message);
                    blocked = true;      // カードを一度外すまで再試行しない
                    challenge = null;    // 使用済みなので取り直す
                }
            }
        }

        // 画像をクリックしたときは、待機をやり直すだけ
        function signInWithFeliCa() {
            showBox(document.getElementById("errorMessage"), "info", "カードをリーダーに置いてください…");
            startAuto();
        }

        // タブが非表示の間は待機を止める
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) stopAuto(); else startAuto();
        });
    </script>
</body>
</html>
